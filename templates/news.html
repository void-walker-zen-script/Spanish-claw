<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>News · Spanish Claw</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="module-page"><header class="site-header discovery-header"><a class="brand" href="{{ url_for('main.index') }}"><span class="brand-mark">SC</span><span>Spanish Claw</span></a><nav class="site-nav discovery-nav"><a href="{{ url_for('main.index') }}">返回首页</a><a href="{{ url_for('main.saved') }}">学习记录</a></nav></header>
<main class="module-shell" data-news-page><section class="module-page-hero"><p class="home-kicker">NEWS LAB</p><h1>用正在发生的事，练西语阅读。</h1><p>选择类别，阅读西语新闻标题；点击后将在原媒体页面阅读完整内容。</p></section><nav class="news-tabs" aria-label="新闻类别">{% for key, category in categories.items() %}<button type="button" data-news-category="{{ key }}" {% if key == 'technology' %}class="active"{% endif %}>{{ category.label }}</button>{% endfor %}</nav><p class="news-status" data-news-status>正在加载科技新闻……</p><section class="news-list" data-news-list aria-live="polite"></section><p class="news-disclaimer">新闻标题与链接由公开 RSS 聚合提供，仅用于学习入口；正文与版权归原媒体所有。</p></main>
<script src="{{ url_for('static', filename='news.js') }}"></script></body></html>
