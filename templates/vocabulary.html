<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>单词 · Spanish Claw</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="module-page"><header class="site-header discovery-header"><a class="brand" href="{{ url_for('main.index') }}"><span class="brand-mark">SC</span><span>Spanish Claw</span></a><nav class="site-nav discovery-nav"><a href="{{ url_for('main.index') }}">返回首页</a><a href="{{ url_for('main.saved') }}">学习记录</a></nav></header>
