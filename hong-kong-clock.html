<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香港时间模拟时钟</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f1df;
      --muted: #b8c5c8;
      --rim: #d7b56d;
      --rim-dark: #826a2c;
      --glass: rgba(255, 255, 255, 0.11);
      --shadow: rgba(0, 0, 0, 0.42);
      --accent: #e84b47;
      --harbor: #38b7c9;
      --night: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 70% 16%, rgba(232, 75, 71, 0.35), transparent 24rem),
        radial-gradient(circle at 17% 76%, rgba(56, 183, 201, 0.32), transparent 28rem),
        linear-gradient(135deg, #07111f 0%, #182032 44%, #1f1c24 100%);
    }

    .scene {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0.55;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.9) 0 1px, transparent 1.3px),
        radial-gradient(circle, rgba(255, 255, 255, 0.62) 0 1px, transparent 1.4px);
      background-position: 0 0, 34px 53px;
      background-size: 130px 130px, 170px 170px;
      animation: drift 24s linear infinite;
    }

    .harbor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 30vh;
      min-height: 190px;
      background:
        linear-gradient(180deg, transparent 0 28%, rgba(7, 17, 31, 0.35) 29% 33%, transparent 34%),
        repeating-linear-gradient(92deg, rgba(56, 183, 201, 0.18) 0 42px, transparent 44px 92px);
      transform: skewY(-1deg);
      opacity: 0.72;
      animation: water 7s ease-in-out infinite alternate;
    }

    .skyline {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14vh;
      height: 165px;
      background:
        linear-gradient(to top, #070b14 0 66%, transparent 66%),
        linear-gradient(to top, #080d17 0 54%, transparent 54%),
        linear-gradient(to top, #080d17 0 72%, transparent 72%),
        linear-gradient(to top, #070b14 0 44%, transparent 44%),
        linear-gradient(to top, #090f1b 0 83%, transparent 83%),
        linear-gradient(to top, #080d17 0 59%, transparent 59%);
      background-repeat: repeat-x;
      background-size: 86px 165px, 112px 165px, 68px 165px, 140px 165px, 54px 165px, 98px 165px;
      background-position: 0 0, 22px 0, 81px 0, 139px 0, 218px 0, 290px 0;
      filter: drop-shadow(0 -16px 26px rgba(56, 183, 201, 0.2));
      opacity: 0.95;
    }

    .wrap {
      width: min(94vw, 690px);
      min-height: min(92vh, 780px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 22px;
      padding: clamp(22px, 5vw, 46px);
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.8rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 18px 35px rgba(0, 0, 0, 0.4);
    }

    .zone {
      margin-top: 12px;
      color: var(--muted);
      font-size: clamp(0.92rem, 2.2vw, 1.08rem);
      letter-spacing: 0;
    }

    .clock {
      width: min(78vw, 430px);
      aspect-ratio: 1;
      position: relative;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0 5%, transparent 5.4%),
        radial-gradient(circle at 42% 30%, rgba(255, 255, 255, 0.2), transparent 21%),
        radial-gradient(circle at 50% 50%, #23303c 0 55%, #121a24 56% 72%, #0b111b 73% 100%);
      border: clamp(8px, 1.9vw, 14px) solid var(--rim);
      box-shadow:
        inset 0 0 0 4px rgba(255, 255, 255, 0.08),
        inset 0 0 42px rgba(0, 0, 0, 0.55),
        0 26px 70px var(--shadow),
        0 0 56px rgba(215, 181, 109, 0.16);
    }

    .clock::before {
      content: "";
      position: absolute;
      inset: 7.5%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 28px rgba(255, 255, 255, 0.06);
    }

    .clock::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), transparent 31%);
      mix-blend-mode: screen;
      opacity: 0.38;
    }

    .tick {
      --angle: 0deg;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 46%;
      transform: translate(-50%, -100%) rotate(var(--angle));
      transform-origin: 50% 100%;
      z-index: 1;
    }

    .tick::before {
      content: "";
      display: block;
      width: 2px;
      height: 8px;
      margin: 0 auto;
      border-radius: 99px;
      background: rgba(247, 241, 223, 0.42);
    }

    .tick.major::before {
      width: 4px;
      height: 18px;
      background: var(--rim);
      box-shadow: 0 0 12px rgba(215, 181, 109, 0.35);
    }

    .numeral {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin: -21px 0 0 -21px;
      font-size: clamp(1rem, 4.2vw, 1.55rem);
      font-weight: 800;
      color: rgba(247, 241, 223, 0.9);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      transform: rotate(var(--angle)) translateY(-158px) rotate(calc(-1 * var(--angle)));
      z-index: 2;
    }

    .hand {
      --rotation: 0deg;
      position: absolute;
      left: 50%;
      bottom: 50%;
      border-radius: 999px;
      transform: translateX(-50%) rotate(var(--rotation));
      transform-origin: 50% 100%;
      z-index: 5;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .hour {
      width: clamp(8px, 2vw, 12px);
      height: 26%;
      background: linear-gradient(180deg, #fff5d3, #b99143);
    }

    .minute {
      width: clamp(5px, 1.4vw, 8px);
      height: 36%;
      background: linear-gradient(180deg, #fdfbf2, #d4c184);
    }

    .second {
      width: clamp(2px, 0.8vw, 4px);
      height: 41%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(232, 75, 71, 0.6);
    }

    .second::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 18%;
      transform: translateX(-50%);
      background: var(--accent);
      border-radius: 999px;
    }

    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(18px, 4vw, 26px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #fff8df 0 21%, var(--accent) 23% 56%, #8d2022 58% 100%);
      box-shadow: 0 0 0 7px rgba(0, 0, 0, 0.25), 0 0 24px rgba(232, 75, 71, 0.34);
      z-index: 7;
    }

    .readout {
      width: min(92vw, 520px);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(7, 17, 31, 0.62);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(18px);
    }

    .digital {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.65rem, 6.4vw, 3.2rem);
      line-height: 1;
      font-weight: 800;
      color: white;
    }

    .date {
      margin-top: 7px;
      color: var(--muted);
      font-size: clamp(0.86rem, 2.4vw, 1rem);
    }

    .pulse {
      width: 38px;
      aspect-ratio: 1;
      border: 2px solid rgba(56, 183, 201, 0.72);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 22px rgba(56, 183, 201, 0.28);
    }

    .pulse::before,
    .pulse::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px solid rgba(56, 183, 201, 0.55);
      animation: pulse 1.4s ease-out infinite;
    }

    .pulse::after {
      animation-delay: 0.7s;
    }

    @keyframes drift {
      to {
        background-position: 130px 130px, 204px 183px;
      }
    }

    @keyframes water {
      from {
        transform: skewY(-1deg) translateY(0);
      }
      to {
        transform: skewY(-1deg) translateY(10px);
      }
    }

    @keyframes pulse {
      from {
        opacity: 0.8;
        transform: scale(0.35);
      }
      to {
        opacity: 0;
        transform: scale(1.45);
      }
    }

    @media (max-width: 560px) {
      body {
        overflow-y: auto;
      }

      .wrap {
        min-height: 100vh;
        padding-block: 26px;
      }

      .numeral {
        transform: rotate(var(--angle)) translateY(calc(-1 * min(31vw, 146px))) rotate(calc(-1 * var(--angle)));
      }

      .readout {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .pulse {
        width: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stars,
      .harbor,
      .pulse::before,
      .pulse::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="skyline"></div>
    <div class="harbor"></div>
  </div>

  <main class="wrap">
    <header>
      <h1>香港时间</h1>
      <div class="zone">Asia/Hong_Kong · UTC+08:00</div>
    </header>

    <section class="clock" aria-label="香港时间模拟时钟">
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>
      <div class="pin"></div>
    </section>

    <section class="readout" aria-live="polite">
      <div>
        <div class="digital" id="digitalTime">00:00:00</div>
        <div class="date" id="dateText">正在同步香港时间</div>
      </div>
      <div class="pulse" aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const clock = document.querySelector(".clock");
    const hourHand = document.getElementById("hourHand");
    const minuteHand = document.getElementById("minuteHand");
    const secondHand = document.getElementById("secondHand");
    const digitalTime = document.getElementById("digitalTime");
    const dateText = document.getElementById("dateText");

    const timeFormatter = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Hong_Kong",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    });

    const dateFormatter = new Intl.DateTimeFormat("zh-Hans-HK", {
      timeZone: "Asia/Hong_Kong",
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    for (let i = 0; i < 60; i += 1) {
      const tick = document.createElement("span");
      tick.className = i % 5 === 0 ? "tick major" : "tick";
      tick.style.setProperty("--angle", `${i * 6}deg`);
      clock.appendChild(tick);
    }

    for (let i = 1; i <= 12; i += 1) {
      const number = document.createElement("span");
      number.className = "numeral";
      number.textContent = String(i);
      number.style.setProperty("--angle", `${i * 30}deg`);
      clock.appendChild(number);
    }

    function hongKongParts(now) {
      const parts = timeFormatter.formatToParts(now);
      return Object.fromEntries(parts.filter(part => part.type !== "literal").map(part => [part.type, Number(part.value)]));
    }

    function updateClock() {
      const now = new Date();
      const { hour, minute, second } = hongKongParts(now);
      const smoothSecond = second + now.getMilliseconds() / 1000;
      const smoothMinute = minute + smoothSecond / 60;
      const smoothHour = (hour % 12) + smoothMinute / 60;

      hourHand.style.setProperty("--rotation", `${smoothHour * 30}deg`);
      minuteHand.style.setProperty("--rotation", `${smoothMinute * 6}deg`);
      secondHand.style.setProperty("--rotation", `${smoothSecond * 6}deg`);
      digitalTime.textContent = timeFormatter.format(now);
      dateText.textContent = dateFormatter.format(now);

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
